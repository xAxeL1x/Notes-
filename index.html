/* ---- modern skin ---- */
:root{--bg:#f4f5fb;--ink:#1b1d2b;--mute:#6b6f85;--line:#e3e5f0;--hov:#eceefa;--acc:#5b5bd6;--accsoft:#e6e6fb;--accink:#fff;--c0:#fff;--c1:#ffdfe5;--c2:#ffecc4;--c3:#d6f4e4;--c4:#d6e8ff;--c5:#e5dcff;--r:22px;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101119;--ink:#eceefb;--mute:#9a9eb8;--line:#272a3c;--hov:#1b1d2d;--acc:#9d9dff;--accsoft:#25264a;--accink:#14152a;--c0:#181a27;--c1:#4a2432;--c2:#47381a;--c3:#1f4033;--c4:#1f3a5c;--c5:#3a2d62}}
:root[data-theme="dark"]{--bg:#101119;--ink:#eceefb;--mute:#9a9eb8;--line:#272a3c;--hov:#1b1d2d;--acc:#9d9dff;--accsoft:#25264a;--accink:#14152a;--c0:#181a27;--c1:#4a2432;--c2:#47381a;--c3:#1f4033;--c4:#1f3a5c;--c5:#3a2d62}
header{background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:0}
h1{font-weight:700;letter-spacing:-.2px}
.ib{transition:background .2s,transform .25s var(--spring)}.ib:active{transform:scale(.86)}
.sbar{border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .25s var(--ease),background .25s}
.sbar:focus-within{background:var(--c0);box-shadow:0 0 0 2px var(--acc),0 10px 28px -8px color-mix(in srgb,var(--acc) 45%,transparent)}
aside button{border-radius:999px;transition:background .2s,transform .25s var(--ease)}aside button:active{transform:scale(.97)}
aside button.on{background:var(--accsoft);color:var(--acc);font-weight:700}
#cmp{border:0;border-radius:26px;box-shadow:0 1px 2px rgba(20,20,60,.06),0 14px 34px -12px rgba(40,40,120,.28);transition:background .3s var(--ease),box-shadow .3s}
.card{border:1px solid color-mix(in srgb,var(--ink) 7%,transparent);border-radius:var(--r);box-shadow:0 1px 2px rgba(20,20,60,.05),0 8px 20px -12px rgba(40,40,120,.25);transition:transform .3s var(--spring),box-shadow .3s var(--ease),background .3s}
.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(20,20,60,.06),0 16px 30px -12px rgba(40,40,120,.34)}.card:active{transform:scale(.985)}
.card.in{animation:rise .55s var(--spring) backwards}.grid .card.in:nth-child(2){animation-delay:.05s}.grid .card.in:nth-child(3){animation-delay:.1s}.grid .card.in:nth-child(4){animation-delay:.15s}.grid .card.in:nth-child(n+5){animation-delay:.2s}
.card .im img,.card .im{border-radius:var(--r) var(--r) 0 0}.im img{border-radius:0}
.chip{border:0;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:999px;padding:2px 12px}
.tb button,.acts button,.btn,.qk button{border-radius:999px;transition:background .2s,transform .2s var(--spring)}.tb button:active,.btn:active,.qk button:active{transform:scale(.93)}
.lm,.air{border-radius:16px}.btn{border-radius:999px}
.ir.sub{margin-inline-start:30px}.ir .li,.ir .ni{transition:color .25s}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:7px;border:2px solid var(--mute);display:inline-grid;place-content:center;flex:none;margin:0;cursor:pointer;transition:background .2s,border-color .2s,transform .3s var(--spring)}
input[type=checkbox]::after{content:"";width:10px;height:5px;border-left:2.5px solid var(--accink);border-bottom:2.5px solid var(--accink);transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform .28s var(--spring)}
input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}input[type=checkbox]:checked::after{transform:rotate(-45deg) scale(1)}input[type=checkbox]:active{transform:scale(.8)}
.sw{transition:transform .25s var(--spring),box-shadow .2s}.sw:hover{transform:scale(1.12)}
.fb{border-radius:20px;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 62%,#ff7ac8));transition:transform .4s var(--spring),border-radius .4s var(--spring)}#fab.op .fb{transform:rotate(135deg);border-radius:50%}
.dial button{border-radius:999px;background:var(--c0);color:var(--ink);border:1px solid var(--line)}#fab.op .dial button{animation:dialin .45s var(--spring) backwards}
.dial button:nth-child(5){animation-delay:.02s}.dial button:nth-child(4){animation-delay:.06s}.dial button:nth-child(3){animation-delay:.1s}.dial button:nth-child(2){animation-delay:.14s}.dial button:nth-child(1){animation-delay:.18s}
dialog{border-radius:28px}dialog[open]{animation:pop .35s var(--spring)}dialog::backdrop{background:rgba(10,10,30,.5);backdrop-filter:blur(6px);animation:fade .25s}
#toast{border-radius:999px;animation:rise .4s var(--spring)}
.dp{animation:fade .2s}.dt button{border-radius:999px}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.95)}}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.95)}}
@keyframes dialin{from{opacity:0;transform:translateY(18px) scale(.8)}}
@keyframes fade{from{opacity:0}}
@media (max-width:800px){dialog{border-radius:0}dialog[open]{animation:sheet .4s var(--ease)}}
@keyframes sheet{from{opacity:0;transform:translateY(60px)}}
#sdlg{background:var(--bg)}#sdlg .ed{padding:14px 18px 22px}

.hint{color:var(--mute);font-size:13px;margin:0 0 10px}

svg{display:block}
.ib{display:grid;place-items:center}

.ed{padding:16px 18px 0}

.tb button{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;padding:0;color:var(--mute)}

/* ---- v3: logo, splash, status colors, motion ---- */
body{text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
h1{display:flex;align-items:center}.lg{display:inline-grid;margin-inline-end:10px;filter:drop-shadow(0 4px 10px rgba(91,70,230,.35))}.lg svg{width:32px;height:32px}
body.sc header{box-shadow:0 12px 26px -18px rgba(30,30,90,.5)}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:16px;background:var(--bg);transition:opacity .45s var(--ease),transform .45s var(--ease)}
#splash.hide{opacity:0;transform:scale(1.05);pointer-events:none}
#splash svg{width:96px;height:96px;animation:logoIn .8s var(--spring) both;filter:drop-shadow(0 16px 28px rgba(91,70,230,.4))}
#splash b{font-size:20px;color:var(--ink);animation:rise .6s .2s var(--ease) backwards}

const K='notes-v2';let S={notes:[],labels:[],grid:true},view='notes',term='';

const idbReq=q=>new Promise((res,rej)=>{q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const idbTx=f=>new Promise((res,rej)=>{const t=DB.d.transaction(['notes','meta'],'readwrite');f(t.objectStore('notes'),t.objectStore('meta'));t.oncomplete=res;t.onerror=t.onabort=()=>rej(t.error)});
const metaOf=()=>({labels:S.labels,grid:S.grid,sort:S.sort,theme:S.theme,sync:S.sync,fb:S.fb,ak:S.ak,kw:S.kw,pay:S.pay,dirty:S.dirty,order:S.notes.map(n=>n.id)});
let ft;

async function flush(keep){
  clearTimeout(ft);
  if(!DB.d){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('المساحة امتلت، احذف صور أو ملاحظات قديمة')}return}
  const ch=[],gone=[],ids=new Set();
  S.notes.forEach(n=>{ids.add(n.id);let g=sigOf(n);if(sigs.get(n.id)!==g){if(!keep){n.ts=Date.now();g=sigOf(n)}sigs.set(n.id,g);ch.push(n)}});
  [...sigs.keys()].forEach(id=>{if(!ids.has(id)){sigs.delete(id);gone.push(id)}});
  try{await idbTx((ns,ms)=>{ch.forEach(n=>ns.put(n));gone.forEach(id=>ns.delete(id));ms.put(metaOf(),'main')})}catch(e){toast('تعذّر الحفظ على الجهاز')}
  ch.forEach(schedNotif);gone.forEach(cancelNotif);

const fix=n=>{if(!n.imgs)n.imgs=n.img?[n.img]:[];if(!n.auds)n.auds=[];if(!n.items)n.items=[];if(!n.ts)n.ts=Date.now();return n};
function normalize(){S.notes=S.notes.filter(n=>!(n.trashed&&Date.now()-n.tt>7*864e5));S.notes.forEach(fix);S.sort=S.sort||'manual'}
async function boot(){

    const rows=await idbReq(DB.d.transaction('notes').objectStore('notes').getAll()),m=await idbReq(DB.d.transaction('meta').objectStore('meta').get('main'));

      rows.forEach(fix);rows.forEach(n=>sigs.set(n.id,sigOf(n)));

}

/* ---------- exact calculation engine ---------- */
const _AR='٠١٢٣٤٥٦٧٨٩',_FA='۰۱۲۳۴۵۶۷۸۹';
function evalEx(s){let i=0;const num=()=>{const m=/^\d+(\.\d+)?/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return +m[0]};
  const fac=()=>{if(s[i]==='-'){i++;return -fac()}if(s[i]==='+'){i++;return fac()}if(s[i]==='('){i++;const v=add();if(s[i++]!==')')throw 0;return v}return num()};
  const mul=()=>{let v=fac();while(s[i]==='*'||s[i]==='/'){const o=s[i++],r=fac();v=o==='*'?v*r:v/r}return v};
  const add=()=>{let v=mul();while(s[i]==='+'||s[i]==='-'){const o=s[i++],r=mul();v=o==='+'?v+r:v-r}return v};
  const v=add();if(i!==s.length||!isFinite(v))throw 0;return v}
function calcLine(raw){
  let s=String(raw).replace(/[٠-٩]/g,c=>_AR.indexOf(c)).replace(/[۰-۹]/g,c=>_FA.indexOf(c)).replace(/٫/g,'.').replace(/[٬،]/g,',').replace(/×/g,'*').replace(/÷/g,'/').replace(/[−–—]/g,'-');
  s=s.replace(/\d{1,3}(,\d{3})+(?![\d,])/g,m=>m.replace(/,/g,'')).replace(/(\d),(\d)/g,'$1.$2').replace(/(\d)\s*[xX]\s*(?=\d)/g,'$1*');
  if(!/\d/.test(s)||/\d{4}-\d{1,2}-\d{1,2}/.test(s))return null;
  const nums=s.match(/\d+(\.\d+)?/g)||[];
  if(nums.length===1&&(/^0\d{7,}$/.test(nums[0])||nums[0].replace('.','').length>=12))return null;
  const ex=s.replace(/[^\d.+\-*/()]/g,' ').replace(/^[+*/)\s]+|[+\-*/(\s]+$/g,'').replace(/\s+/g,' ');
  if(!ex)return null;
  try{if(!/\d\s\d|\)\s*\d|\d\s*\(/.test(ex)){const v=evalEx(ex.replace(/\s/g,''));return{v:Math.round(v*1e8)/1e8,amb:false}}}catch(e){}
  return{v:+nums[0],amb:nums.length>1}
}
function norm2(s){return String(s).toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')}
const KW0={fee:'رسوم تحويل، رسوم التحويل، مصاريف تحويل',ok:'ت، تم، تحصيل، تحصل، اتحصل، محصل، تم التحصيل، تم تحصيل، ✓، ✔، √',out:'خارج، خرج، لم، لسه، لسا، باقي، متبقي، غير محصل، لم يحصل، لم يتحصل، ✗، ✘'};
let KWC=null;
function kwCompile(){const raw=S.kw||KW0,mk=t=>String(t||'').split(/[,،\n]+/).map(x=>norm2(x).trim().replace(/\s+/g,' ')).filter(Boolean);KWC={ok:mk(raw.ok),out:mk(raw.out),fee:mk(raw.fee!==undefined?raw.fee:KW0.fee)}}
function lineStatus(t){
  if(!KWC)kwCompile();
  const w=' '+norm2(t).replace(/[0-9٠-٩۰-۹]+/g,' ').replace(/([✓✔√✗✘])/g,' $1 ').replace(/[^\p{L}✓✔√✗✘]+/gu,' ').replace(/\s+/g,' ').trim()+' ';
  if(KWC.fee.some(k=>w.includes(' '+k+' ')))return 'fee';
  if(KWC.out.some(k=>w.includes(' '+k+' ')))return 'out';
  if(KWC.ok.some(k=>w.includes(' '+k+' ')))return 'ok';

function calcNote(d){
  const lines=d.list?d.items.map(x=>({t:x.t,d:!!x.d,s:!!x.s})):String(d.text).split('\n').map(t=>({t,d:false,s:false}));
  const rows=[];let paid=0,outv=0,fees=0,done=0,todo=0,n=0,amb=0,base=null;
  lines.forEach((l,i)=>{
    if(!l.t.trim()||/^\s*(الإجمالي|المجموع|total|sum|المرتب)/i.test(l.t)||/^\s*(تم تحصيله|خارج|المتبقي|المحصل|الرسوم)\s*[:：]/.test(l.t))return;
    const r=calcLine(l.t),st=lineStatus(l.t),row={i,t:l.t,v:r?r.v:null,amb:r?r.amb:false,d:l.d,s:l.s,st,base:false};

  else if(k==='cp'){const D=dashData(),t='حساب '+D.rows.length+' ملاحظة\nإجمالي المحصّل: '+fmtM(D.paid)+'\n× '+D.P.rate+'% = '+fmtM(D.cut)+'\n− رسوم التحويل: '+fmtM(D.fees)+'\n− زيت وبنزين: '+fmtM(D.P.fuel)+'\n− رسوم إدارية: '+fmtM(D.P.admin)+'\nصافي المرتب: '+fmtM(D.net);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('اتنسخت النتيجة'),()=>toast('صافي المرتب: '+fmtM(D.net)))}
  else if(k==='aq')askDash(b.dataset.q)});
cdlg.addEventListener('input',e=>{
  if(!e.target.classList.contains('pi'))return;
  const g=id=>{const v=parseFloat($('#'+id,cdlg).value);return isFinite(v)?v:0};
  S.pay={rate:g('dpr'),fuel:g('dpf'),admin:g('dpa')};save();$('#stp',cdlg).innerHTML=dashSteps(dashData())});
cdlg.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='dq'){e.preventDefault();const q=e.target.value.trim();if(q)askDash(q)}});
async function askDash(q){
  const sm=await useSample();if(!sm){toast('الذكاء الاصطناعي مش متاح. ضيفي مفتاح Anthropic من الإعدادات');return}
  const D=dashData(),ctx=D.rows.map(x=>x.name+': أساسي '+x.c.all+' | محصّل '+x.c.ok+' | خارج '+x.c.out+' | رسوم تحويل '+x.c.fees+(x.c.diff?' | فرق '+x.c.diff:'')).join('\n');
  const info='قواعد: أول رقم في الملاحظة هو الأساسي، «ت» تحصيل، «خارج» هو المتبقي اللي لم يتحصّل، «رسوم تحويل» بتتخصم. المرتب = إجمالي المحصّل × '+D.P.rate+'% ثم خصم رسوم التحويل ثم '+D.P.fuel+' زيت وبنزين ثم '+D.P.admin+' رسوم إدارية.\nالحساب الآلي الدقيق (اعتمد عليه ولا تعيد الجمع بنفسك):\n'+ctx+'\nإجمالي المحصّل: '+D.paid+' | بعد النسبة: '+D.cut+' | رسوم التحويل: '+D.fees+' | الصافي: '+D.net;
  dashBusy=true;dashRes='';$('#dai',cdlg).innerHTML=dashAIHTML();
  try{const r=await sm('أنت مساعد حسابي جوه تطبيق ملاحظات، ردّ بالعربية المصرية باختصار وبدون ماركداون.\n\n'+info+'\n\nالطلب: '+q,{modelTier:'default',cache:false});dashRes=r.text}
  catch(e){dashRes=e&&e.code==='not_granted'?'لازم توافق على استخدام كلود الأول':'حصلت مشكلة، جرّبي تاني'}
  dashBusy=false;$('#dai',cdlg).innerHTML=dashAIHTML();
}
$('#q').oninput=e=>{term=e.target.value;clearTimeout(qt);qt=setTimeout(()=>{LIM=60;render()},120)};
$('#gv').onclick=()=>{S.grid=!S.grid;save();render()};
$('#st').onclick=()=>{const o=['manual','new','old','az'],nm={manual:'ترتيب يدوي',new:'الأحدث أولًا',old:'الأقدم أولًا',az:'أبجدي'};S.sort=o[(o.indexOf(S.sort)+1)%4];save();render();toast('الترتيب: '+nm[S.sort])};
$('#fb').onclick=()=>$('#fab').classList.toggle('op');
$('#dial').onclick=e=>{const t=e.target.dataset.t;if(!t)return;$('#fab').classList.remove('op');openNew(t)};
$('#mn').onclick=()=>document.body.classList.toggle('sb');
/* reminders */
setInterval(()=>{let ch=0;S.notes.forEach(n=>{if(n.reminder&&!n.fired&&!n.trashed&&new Date(n.reminder)<=new Date()){n.fired=true;ch=1;if(n.rep){let dt=new Date(n.reminder);const st=n.rep==='d'?864e5:6048e5,p=x=>String(x).padStart(2,'0');while(dt<=new Date())dt=new Date(+dt+st);n.reminder=dt.getFullYear()+'-'+p(dt.getMonth()+1)+'-'+p(dt.getDate())+'T'+p(dt.getHours())+':'+p(dt.getMinutes());n.fired=false}const m=n.title||n.text.slice(0,50)||n.items.map(i=>i.t).join('، ').slice(0,50);toast('⏰ تذكير: '+m,8000);try{if(window.Notification&&Notification.permission==='granted')new Notification('تذكير',{body:m})}catch(x){}}});if(ch){save();render()}},20000);
setTimeout(()=>{const sp=$('#splash');if(sp)sp.remove()},5000);
boot();
</script>
